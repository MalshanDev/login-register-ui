<!DOCTYPE html>
<html>

<head>
    <title>Login-Registre-ui</title>
    <link rel="stylesheet" type="text/css" href="stylesheet.css" />
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <script src="script.js"></script>
</head>

<body>
    <div class="wrapper">

        <!-- Login Form -->
        <form action="#" class="login-form" id="login-form">
            <h2>Login</h2>
            <div class="input-group">
                <input type="text" placeholder="Username" required />
                <i class="bxf bx-user"></i>
            </div>
            <div class="input-group">
                <input type="password" placeholder="password" required />
                <i class="bxf bx-lock"></i>
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox" />Remember
                </label>
                <a href="#">Forgot Password?</a>
            </div>
            <button class="btn" type="submit">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="#" onclick="showRegistrationForm()">Register</a></p>
            </div>
        </form>

        <!-- Registration Form -->
        <form action="#" class="registration-form" id="register-form">
            <h2>Registration</h2>
            <div class="input-group">
                <input type="text" placeholder="Username" required />
                <i class="bxf bx-user"></i>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email" required />
                <i class="bxf bx-envelope"></i>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Password" required />
                <i class="bxf bx-lock"></i>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Confirm Password" required />
                <i class="bxf bx-lock"></i>
            </div>
            <button class="btn" type="submit">Register</button>
            <div class="login-link">
                <p>Already have an account? <a href="#" onclick="showLoginForm()">Login</a></p>
            </div>
    </div>
</body>

</html>
